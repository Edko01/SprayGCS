name: Windows installer

# Builds the SprayGCS Windows installer (64-bit) on every push to main, and on
# demand from the Actions tab ("Run workflow").
# - Every build attaches the installer to its run (Summary -> Artifacts).
# - When custom/spraygcs-version.txt holds a version that has no release yet, the build also
#   publishes a GitHub Release "SprayGCS <version>" with the installer, and tags it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
  BUILD_TYPE: Release
  PACKAGE: SprayGCS-installer-AMD64

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 180

    permissions:
      contents: write   # to publish a Release on version tags

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The version number comes from git describe, which needs the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        shell: bash
        run: |
          version="$(tr -d ' \r\n' < custom/spraygcs-version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::custom/spraygcs-version.txt must look like 1.2.3 (got '$version')"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Release $tag already exists; this build is attached to the run only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # Local tag so the app's version number (from git describe) is right.
            git -c user.name=ci -c user.email=ci@localhost tag "$tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: ${{ env.BUILD_TYPE }}

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          preset: Windows
          extra-args: >-
            -DQGC_BUILD_PORTABLE_TESTS=OFF
            -DQGC_ENABLE_GST_VIDEOSTREAMING=ON
            -DQGC_CPACK_GENERATOR=NSIS

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          output-file: ${{ runner.temp }}/build-output.log

      - name: Show build errors
        if: failure()
        shell: python
        run: |
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "build-output.log")
          lines = open(path, encoding="utf-8", errors="replace").read().splitlines() if os.path.exists(path) else []
          errs = [l.strip() for l in lines if re.search(r"\berror\b|: fatal|FAILED:", l, re.I)]
          text = "\n".join(errs[:80]) or "\n".join(lines[-60:]) or "no build log"
          enc = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=Build errors::{enc[:60000]}")

      - name: Check the app starts
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ env.BUILD_TYPE }}/SprayGCS.exe
          type: exe
          build-dir: ${{ runner.temp }}/build

      - name: Create Installer
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: ${{ env.BUILD_TYPE }}
          target: qgc-package
          parallel: 'false'

      - name: Find installer
        id: installer
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "build\$env:PACKAGE.exe"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            Get-ChildItem (Join-Path $env:RUNNER_TEMP 'build') -Filter *.exe | Format-Table Name, Length
            Write-Error "Installer not found: $path"
            exit 1
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: steps.version.outputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SprayGCS ${{ steps.version.outputs.version }}
          files: ${{ steps.installer.outputs.path }}
          body: |
            Windows 64-bit installer: download **${{ env.PACKAGE }}.exe** below and run it.
            Windows may show "Windows protected your PC" because the installer isn't code-signed:
            click **More info**, then **Run anyway**.
